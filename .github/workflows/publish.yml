name: Publish

# Publishes the VSIX of an existing GitHub release to the Visual Studio
# Marketplace and, if a token for it is set, to Open VSX. The release workflow
# starts it once the release exists; it can also be run by hand for a tag. A
# release is only created after the tests have passed on Linux, Windows and
# macOS, so what is published is what was tested.
#
# The Marketplace needs no stored secret. The publisher in
# extension/package.json has a Trusted Publishing policy that names this
# repository and this file, publish.yml: renaming the file or moving the
# publish step into another workflow breaks it until the policy is changed
# to match.
#
# Open VSX is optional and needs one repository secret:
#   OVSX_PAT  an Open VSX access token (that step is skipped without it)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, for example v0.1.0
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job ask GitHub for the short-lived identity token that the
      # Marketplace exchanges for permission to publish.
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # The publishing tools come from the tagged commit's lockfile, not from
      # whatever is newest on the day.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - name: Download the VSIX from the release
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "nandwright-${TAG#v}.vsix" --dir release
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to the Visual Studio Marketplace
        run: extension/node_modules/.bin/vsce publish --oidc --packagePath "release/nandwright-${TAG#v}.vsix"
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@1.4.0 publish "release/nandwright-${TAG#v}.vsix"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
